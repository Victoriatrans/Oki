<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>Portal Pemutusan Mitra</title>
  <style>
    :root { color-scheme: light; --green:#15803d; --dark:#14532d; --muted:#64748b; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#f0fdf4,#ecfdf5 55%,#f8fafc);
      color:#0f172a; display:flex; align-items:center; justify-content:center;
      padding:20px;
    }
    .panel {
      width:min(100%,440px); background:#fff; border:1px solid #dcfce7;
      border-radius:22px; padding:30px 24px; box-shadow:0 18px 55px rgba(20,83,45,.12);
      text-align:center;
    }
    .brand { color:var(--dark); font-size:13px; font-weight:700; letter-spacing:1.4px; margin-bottom:22px; }
    h1 { margin:0 0 8px; font-size:25px; color:#0f172a; }
    .sub { margin:0 0 22px; color:var(--muted); font-size:14px; }
    label { display:block; text-align:left; font-size:13px; font-weight:700; margin:14px 0 6px; }
    input {
      width:100%; padding:13px 14px; border:1px solid #cbd5e1; border-radius:11px;
      font-size:16px; outline:none; background:#fff;
    }
    input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(21,128,61,.12); }
    button {
      width:100%; margin-top:20px; border:0; border-radius:11px; padding:14px;
      background:var(--green); color:#fff; font-size:16px; font-weight:700; cursor:pointer;
    }
    button:active { transform:translateY(1px); }
    .error { min-height:20px; color:#b91c1c; font-size:13px; margin-top:12px; }
    .status { display:none; }
    .check {
      width:112px; height:112px; border-radius:50%; margin:4px auto 24px;
      display:grid; place-items:center; background:#dcfce7; border:7px solid #86efac;
      color:#15803d; font-size:72px; font-weight:400; line-height:1;
    }
    .status h1 { color:#166534; font-size:26px; line-height:1.3; }
    .waiting { margin:14px 0 0; font-size:19px; font-weight:700; color:#334155; }
    .note { margin:18px 0 0; font-size:12px; color:#64748b; }
    @media (max-width:380px) { .panel{padding:25px 18px} .status h1{font-size:22px} }
  </style>
</head>
<body>
  <main class="panel">
    <section id="login">
      <div class="brand">PORTAL YAYASAN OKI</div>
      <h1>Login Anggota</h1>
      <p class="sub">Silakan masuk menggunakan akun Anda.</p>
      <form id="loginForm" autocomplete="off">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Masuk ke Portal</button>
        <div id="error" class="error" role="alert" aria-live="polite"></div>
      </form>
    </section>

    <section id="status" class="status" aria-live="polite">
      <div class="check" aria-hidden="true">✓</div>
      <h1>PEMUTUSAN MITRA SUKSES</h1>
      <p class="waiting">….menunggu pencairan…….</p>
      <p class="note">Status ini merupakan informasi pada portal.</p>
    </section>
  </main>

  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const login = document.getElementById('login');
      const status = document.getElementById('status');
      const error = document.getElementById('error');

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (username === 'member958' && password === 'nia231100') {
          login.style.display = 'none';
          status.style.display = 'block';
        } else {
          error.textContent = 'Username atau password tidak sesuai.';
        }
      });
    }());
  </script>
</body>
</html>
